<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Шейкер — тренажёр бармена</title>
<style>
:root{--bg:#14110F;--card:#1F1A17;--card2:#2A241F;--line:#3A322B;--text:#F4EDE3;--muted:#B8AC9C;--acc:#E8A33D;--accInk:#14110F;--ok:#9BE3A5;--okBg:#1F3A26;--bad:#FFB4A6;--badBg:#4A211B;--heart:#FF8A73}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 32px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.2}
h2{margin:0;font-size:18px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--acc);text-transform:uppercase}
.card{background:var(--card);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{min-height:52px;border-radius:16px;border:none;background:var(--acc);color:var(--accInk);font-weight:800;font-size:17px;padding:0 18px;width:100%}
.btn.sec{background:var(--card2);color:var(--text)}
.icon{width:44px;height:44px;border-radius:22px;border:none;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;padding:8px 10px;text-align:center}
.opt:active{border-color:var(--acc)}
.opt.wide{grid-column:1/-1;text-align:left;padding:10px 14px}
.opt .sub{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.bar{flex:1;height:14px;border-radius:7px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:7px;transition:width .25s}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:none;border-radius:16px;padding:12px 14px;min-height:60px}
.tile[disabled]{opacity:.45;cursor:default}
.tile .nm{font-weight:800;font-size:17px}
.stars{display:flex;gap:2px}
.msg{border-radius:16px;padding:12px 16px;font-weight:700;min-height:48px;display:flex;align-items:center;background:var(--card);color:var(--muted)}
.msg.ok{background:var(--okBg);color:var(--ok)}
.msg.bad{background:var(--badBg);color:var(--bad)}
.stage{display:flex;align-items:center;gap:14px;min-height:150px}
.stage svg{flex-shrink:0}
.steps{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px}
.chip{display:inline-block;background:var(--card2);border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700;margin:2px 4px 2px 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:none;border-radius:16px;padding:14px 16px;width:100%;text-align:left}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--text);transition:left .2s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px;background:var(--accInk)}
.foot{font-size:13px;color:var(--muted);text-align:center}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>

function glassSvg(type, layers, total) {
  const sh = SHAPES[type]; const H = (sh.b - sh.t) * 0.92; let y = sh.b, rects = '';

  const cid = 'c' + Math.random().toString(36).slice(2, 7);
  return '<svg width="110" height="128" viewBox="0 0 120 140" aria-hidden="true"><defs><clipPath id="' + cid + '"><path d="' + sh.p + '"/></clipPath></defs>' +
    '<path d="' + sh.p + '" fill="#2A241F"/><g clip-path="url(#' + cid + ')">' + rects + '</g>' +
    '<path d="' + sh.p + '" fill="none" stroke="#E9DFD0" stroke-width="3" stroke-linejoin="round"/>' +
    (sh.stem ? '<path d="' + sh.stem + '" fill="none" stroke="#E9DFD0" stroke-width="3" stroke-linecap="round"/>' : '') + '</svg>';
}
const totalVol = c => c.s.reduce((a, x) => a + (typeof x[1] === 'number' ? x[1] : (VOL[x[1]] || 5)), 0);

// ---------- Игра ----------
function startGame(id) {
  const c = byId(id);
  G = { c: c, step: 'glass', lives: 3, idx: 0, poured: [], glass: null, msg: '', kind: '', opts: [] };
  makeOpts(); V.scr = 'game'; render();
}
function makeOpts() {
  const c = G.c;
  if (G.step === 'glass') {
    const others = shuffle(Object.keys(GLASS).filter(k => c.g.indexOf(k) < 0)).slice(0, 3);
    G.opts = shuffle([c.g[0]].concat(others)).map(k => ({ v: k, label: GLASS[k] }));
  } else if (G.step === 'ing') {
    const rest = []; c.s.slice(G.idx).forEach(x => { if (rest.indexOf(x[0]) < 0) rest.push(x[0]); });
    const inRecipe = c.s.map(x => x[0]);
    const pool = shuffle(Object.keys(COLOR).concat(EXTRA_ING).filter(n => inRecipe.indexOf(n) < 0 && n !== 'Вода'));
    const need = Math.max(2, 6 - rest.length);
    G.opts = shuffle(rest.concat(pool.slice(0, need))).map(n => ({ v: n, label: n }));
  } else if (G.step === 'amt') {
    const a = c.s[G.idx][1]; let list;
    if (typeof a === 'number') list = ML.filter(x => x !== a).sort((x, y) => Math.abs(x - a) - Math.abs(y - a)).slice(0, 3);
    else list = shuffle(TXT.filter(x => x !== a)).slice(0, 3);
    G.opts = shuffle([a].concat(list)).map(x => ({ v: x, label: amt(x) }));
  } else if (G.step === 'method') {
    G.opts = Object.keys(METHOD).map(k => ({ v: k, label: METHOD[k][0], sub: METHOD[k][1], wide: true }));
  } else if (G.step === 'garnish') {
    const others = shuffle(GARNISH.filter(x => c.gar.indexOf(x) < 0)).slice(0, 3);
    G.opts = shuffle([c.gar[0]].concat(others)).map(x => ({ v: x, label: x, wide: true }));
  }
}
function wrong(text) {
  G.lives--; G.msg = text; G.kind = 'bad';
  if (G.lives <= 0) { G.step = 'fail'; }
  render(true);
}
function right(text, next) {
  G.msg = text; G.kind = 'ok';
  if (next) G.step = next;
  if (G.step === 'done') finish(); else { makeOpts(); render(); }
}
function pick(i) {
  const o = G.opts[i]; if (!o) return; const c = G.c;
  if (G.step === 'glass') {
    if (c.g.indexOf(o.v) >= 0) { G.glass = o.v; right('Верно! ' + GLASS[o.v] + '.', 'ing'); }
    else wrong('Не тот бокал. ' + c.n + ' подают: ' + c.g.map(k => GLASS[k].toLowerCase()).join(' или ') + '.');
  } else if (G.step === 'ing') {
    const need = c.s[G.idx];
    if (o.v === need[0]) { G.step = 'amt'; G.msg = 'Верно, ' + need[0].toLowerCase() + '. Теперь дозировка.'; G.kind = 'ok'; makeOpts(); render(); }
    else if (c.s.some(x => x[0] === o.v)) wrong(o.v + ' в рецепте есть, но не сейчас. Сейчас по порядку: ' + need[0].toLowerCase() + '.');
    else wrong('В рецепте ' + c.n + ' нет такого ингредиента: ' + o.v.toLowerCase() + '.');
  } else if (G.step === 'amt') {
    const need = c.s[G.idx];
    if (o.v === need[1]) {
      G.poured.push(need); G.idx++;
      right('Верно! ' + need[0] + ': ' + amt(need[1]) + '.', G.idx >= c.s.length ? 'method' : 'ing');
    } else wrong('Не та дозировка. ' + need[0] + ': ' + amt(need[1]) + '.');
  } else if (G.step === 'method') {
    if (o.v === c.m) right('Верно! ' + METHOD[c.m][0] + ': ' + METHOD[c.m][1] + '.', 'garnish');
    else wrong('Не тот метод. ' + c.n + ': ' + METHOD[c.m][0].toLowerCase() + ', ' + METHOD[c.m][1] + '.');
  } else if (G.step === 'garnish') {
    if (c.gar.indexOf(o.v) >= 0) right('Верно! ' + o.v + '.', 'done');
    else wrong('Не то. Украшение: ' + c.gar.join(' или ').toLowerCase() + '.');
  }
}
function finish() {
  const c = G.c; const prev = S.best[c.id] || 0;
  G.newBest = G.lives > prev; G.firstTime = prev === 0;
  S.best[c.id] = Math.max(prev, G.lives);
  G.xp = 10 + (G.lives === 3 ? 5 : 0); S.xp += G.xp;
  const today = dayStr(new Date()); const y = new Date(); y.setDate(y.getDate() - 1);
  if (S.lastDay !== today) { S.streak = S.lastDay === dayStr(y) ? S.streak + 1 : 1; S.lastDay = today; }
  save(); render();
}
function nextCocktail() {
  const c = G.c; const i = D.indexOf(c);
  for (let k = 1; k <= D.length; k++) { const n = D[(i + k) % D.length]; if (unlocked(n.grp) && (S.best[n.id] || 0) < 3) return n.id; }
  return D[(i + 1) % D.length].id;
}
function weakOne() {
  const list = D.filter(c => unlocked(c.grp) && (S.best[c.id] || 0) < 3);
  const from = list.length ? list : D.filter(c => unlocked(c.grp));
  return from[Math.floor(Math.random() * from.length)].id;
}

// ---------- Экраны ----------
function header(left) {
  return '<div class="row">' + left + '<div class="grow"></div><span class="stat">' + ICON.flame + S.streak + '</span><span class="stat" style="color:var(--acc)">' + S.xp + ' XP</span></div>';
}
function renderGate() {
  return '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">' +
    '<p class="eyebrow">Тренажёр бармена</p><h1>Шейкер</h1>' +
    '<p class="muted">Учит рецептуры классических коктейлей: посуда, порядок и дозировки, метод и украшение. Рецепты по спецификациям IBA.</p>' +
    '<div class="card"><h2>Только для взрослых</h2><p class="muted" style="margin-top:6px">В приложении есть рецепты алкогольных напитков. Оно предназначено для людей старше 18 лет. Чрезмерное употребление алкоголя вредит здоровью.</p></div>' +
    '<button class="btn" data-act="adult">Мне есть 18 лет</button></div>';
}
function renderHome() {
  let h = header('<h1>Шейкер</h1><button class="icon" data-act="settings" aria-label="Настройки">' + ICON.gear + '</button>');
  const done = D.filter(c => (S.best[c.id] || 0) > 0).length;
  h += '<div class="card row"><div class="grow"><p class="muted" style="font-size:14px">Освоено коктейлей</p><p style="font-size:22px;font-weight:800">' + done + ' из ' + D.length + '</p></div><button class="btn" style="width:auto" data-act="weak">Тренировка</button></div>';
  GROUPS.forEach((g, gi) => {
    const open = unlocked(gi);
    h += '<div style="display:flex;flex-direction:column;gap:8px"><p class="eyebrow">' + (gi + 1) + '. ' + esc(g) + '</p>';
    if (!open) h += '<p class="muted" style="font-size:14px">Откроется, когда пройдёшь половину коктейлей из блока ' + gi + '.</p>';
    D.filter(c => c.grp === gi).forEach(c => {
      h += '<button class="tile" data-act="open" data-id="' + c.id + '"' + (open ? '' : ' disabled') + '><span class="grow nm">' + esc(c.n) + '</span>' + (open ? stars(S.best[c.id] || 0) : ICON.lock) + '</button>';
    });
    h += '</div>';
  });
  h += '<p class="foot">Рецепты по спецификациям IBA · только 18+</p>';
  return h;
}
function recipeCard(c) {
  let h = '<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="stage">' + glassSvg(c.g[0], c.s, totalVol(c)) +
    '<div><p class="muted" style="font-size:14px">Посуда</p><p style="font-weight:800">' + c.g.map(k => GLASS[k]).join(' или ') + '</p>' +
    '<p class="muted" style="font-size:14px;margin-top:8px">Метод</p><p style="font-weight:800">' + METHOD[c.m][0] + '</p><p class="muted" style="font-size:14px">' + METHOD[c.m][1] + '</p></div></div>';
  h += '<div><p class="muted" style="font-size:14px;margin-bottom:6px">По порядку</p><ol class="steps">' + c.s.map(x => '<li><b>' + esc(x[0]) + '</b> — ' + esc(amt(x[1])) + '</li>').join('') + '</ol></div>';
  h += '<div><p class="muted" style="font-size:14px">Украшение</p><p style="font-weight:700">' + esc(c.gar.join(' или ')) + '</p></div>';
  if (c.tip) h += '<p class="muted" style="font-size:15px">' + esc(c.tip) + '</p>';
  return h + '</div>';
}
function renderStudy() {
  const c = byId(V.cid);
  return '<div class="row"><button class="icon" data-act="home" aria-label="Назад">' + ICON.back + '</button><div class="grow"><p class="eyebrow">Рецепт</p><h1>' + esc(c.n) + '</h1></div>' + stars(S.best[c.id] || 0, 20) + '</div>' +
    recipeCard(c) + '<button class="btn" data-act="play" data-id="' + c.id + '">Собрать коктейль</button>';
}
function renderGame() {
  const c = G.c;
  const parts = { glass: 0, ing: 1, amt: 1, method: 2, garnish: 3 };
  const prog = ((parts[G.step] || 0) + (G.step === 'ing' || G.step === 'amt' ? G.idx / c.s.length : 0)) / 4 * 100;
  let h = '<div class="row"><button class="icon" data-act="quit" aria-label="Выйти">' + ICON.close + '</button><div class="bar"><i style="width:' + prog.toFixed(0) + '%"></i></div><span class="stat" style="color:var(--heart)">' + ICON.heart + G.lives + '</span></div>';
  const q = { glass: 'Какой бокал подаём?', ing: G.idx === 0 ? 'С чего начинаем?' : 'Что дальше по порядку?', amt: 'Сколько: ' + c.s[G.idx < c.s.length ? G.idx : 0][0].toLowerCase() + '?', method: 'Как готовим?', garnish: 'Чем украшаем?' }[G.step];
  h += '<div><p class="eyebrow">Собери · ' + esc(c.n) + '</p><h1>' + esc(q) + '</h1></div>';
  h += '<div class="card stage">' + (G.glass ? glassSvg(G.glass, G.poured, totalVol(c)) + '<div><p class="muted" style="font-size:14px">В бокале</p><p style="font-weight:800">' + GLASS[G.glass] + '</p><p class="muted" style="font-size:14px">' + (G.poured.length ? G.poured.map(x => esc(x[0]) + ' ' + esc(amt(x[1]))).join(' · ') : 'пока пусто') + '</p></div>' :
    '<p class="muted">Сначала посуда. Потом ингредиенты по порядку с дозировкой, метод и украшение.</p>') + '</div>';
  h += '<div class="grid">' + G.opts.map((o, i) => '<button class="opt' + (o.wide ? ' wide' : '') + '" data-act="pick" data-i="' + i + '">' + esc(o.label) + (o.sub ? '<span class="sub">' + esc(o.sub) + '</span>' : '') + '</button>').join('') + '</div>';
  h += '<div class="msg ' + G.kind + '" id="msg" role="status">' + esc(G.msg || (S.hints ? 'Не помнишь? Ошибка покажет правильный ответ.' : 'Выбери вариант.')) + '</div>';
  return h;
}
function renderEnd() {
  const c = G.c; const ok = G.step === 'done';
  let h = '<div class="row"><button class="icon" data-act="home" aria-label="К списку">' + ICON.close + '</button><div class="grow"></div>' + (ok ? stars(G.lives, 26) : '') + '</div>';
  if (ok) h += '<div><p class="eyebrow">+' + G.xp + ' XP · серия ' + S.streak + ' дн.</p><h1>' + esc(c.n) + ' готов!</h1><p class="muted" style="margin-top:6px">' + (G.lives === 3 ? 'Без единой ошибки.' : 'Ошибок: ' + (3 - G.lives) + '. Повтори, чтобы получить три звезды.') + '</p></div>';
  else h += '<div><p class="eyebrow">Жизни закончились</p><h1>Ничего страшного</h1><p class="muted" style="margin-top:6px">Посмотри рецепт и попробуй ещё раз.</p></div>';
  h += recipeCard(c);
  h += ok ? '<button class="btn" data-act="play" data-id="' + nextCocktail() + '">Следующий коктейль</button><button class="btn sec" data-act="play" data-id="' + c.id + '">Собрать ещё раз</button>'
    : '<button class="btn" data-act="play" data-id="' + c.id + '">Попробовать снова</button><button class="btn sec" data-act="home">К списку</button>';
  return h;
}
function renderSettings() {
  return '<div class="row"><button class="icon" data-act="home" aria-label="Назад">' + ICON.back + '</button><h1>Настройки</h1></div>' +
    '<button class="toggle" data-act="hints"><span><b>Подсказки для новичков</b><span class="muted" style="display:block;font-size:14px">Напоминание в игре, что ошибка покажет ответ</span></span><span class="sw' + (S.hints ? ' on' : '') + '"></span></button>' +
    '<div class="card"><h2>О рецептах</h2><p class="muted" style="margin-top:6px">Рецепты взяты из официального списка Международной ассоциации барменов (IBA). В барах встречаются авторские варианты: тренажёр учит базовой классике.</p></div>' +
    '<button class="btn sec" data-act="reset">' + (V.confirmReset ? 'Точно сбросить? Нажми ещё раз' : 'Сбросить прогресс') + '</button>' +
    '<p class="foot">Шейкер · данные хранятся только на этом телефоне</p>';
}
function render(shake) {
  let h;
  if (!S.adult) h = renderGate();
  else if (V.scr === 'study') h = renderStudy();
  else if (V.scr === 'game') h = (G.step === 'done' || G.step === 'fail') ? renderEnd() : renderGame();
  else if (V.scr === 'settings') h = renderSettings();
  else h = renderHome();
  $app.innerHTML = h;
  if (shake) { const m = document.getElementById('msg'); if (m) { m.classList.add('shake'); } if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {} }
  if (!shake && V.scr !== 'game') window.scrollTo(0, 0);
}
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a !== 'reset') V.confirmReset = false;
  if (a === 'adult') { S.adult = true; save(); render(); }
  else if (a === 'home' || a === 'quit') { V.scr = 'home'; G = null; render(); }
  else if (a === 'open') { V.scr = 'study'; V.cid = b.dataset.id; render(); }
  else if (a === 'play') startGame(b.dataset.id);
  else if (a === 'weak') startGame(weakOne());
  else if (a === 'pick') pick(+b.dataset.i);
  else if (a === 'settings') { V.scr = 'settings'; render(); }
  else if (a === 'hints') { S.hints = !S.hints; save(); render(); }
  else if (a === 'reset') {
    if (!V.confirmReset) { V.confirmReset = true; render(); }
    else { S.best = {}; S.xp = 0; S.streak = 0; S.lastDay = ''; V.confirmReset = false; save(); V.scr = 'home'; render(); }
  }
});
render();
if ('serviceWorker' in navigator && !false) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

</body>
</html>
